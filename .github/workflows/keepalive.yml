name: Keep-alive

# Chama o health check da aplicação periodicamente. A requisição consulta o
# banco, evitando que o projeto gratuito do Supabase seja pausado por inatividade
# (o limite é de 7 dias).

on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, às 12:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /health/
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::warning::Variável HEALTHCHECK_URL não configurada. Defina-a em Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 "$HEALTHCHECK_URL"
