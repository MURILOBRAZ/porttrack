services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: porttrack
      POSTGRES_USER: porttrack
      POSTGRES_PASSWORD: porttrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porttrack"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "docker-local-secret-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://porttrack:porttrack@db:5432/porttrack"
      # Localmente não há HTTPS: libera os cookies de sessão/CSRF sem "Secure".
      DJANGO_INSECURE_COOKIES: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
